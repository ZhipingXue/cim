syntax = "proto3";

package cim.e134;

import "cim_common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// ─────────────────────────────────────────────
// DCP State — dynamic object with lifecycle
// ─────────────────────────────────────────────

enum DcpState {
    DCP_STATE_UNSPECIFIED    = 0;
    DCP_STATE_CREATED        = 1;
    DCP_STATE_ACTIVATED      = 2;
    DCP_STATE_PAUSED         = 3;
    DCP_STATE_DEACTIVATED    = 4;
    DCP_STATE_DELETED        = 5;
}

// ─────────────────────────────────────────────
// Data types for parameters
// ─────────────────────────────────────────────

enum DataType {
    DATA_TYPE_UNSPECIFIED       = 0;
    DATA_TYPE_STATUS_VARIABLE   = 1;
    DATA_TYPE_DATA_VARIABLE     = 2;
    DATA_TYPE_EVENT             = 3;
    DATA_TYPE_ALARM             = 4;
}

// ─────────────────────────────────────────────
// Data parameter (dynamic, addable/removable)
// ─────────────────────────────────────────────

message DataParameter {
    string                    parameter_name     = 1;
    DataType                  data_type          = 2;
    string                    data_source        = 3;  // module_id or "equipment"
    string                    collection_method  = 4;  // "periodic", "event_triggered", "on_change"
    google.protobuf.Duration  interval           = 5;  // for periodic
    string                    trigger_event      = 6;  // for event_triggered
}

// ─────────────────────────────────────────────
// Data Collection Plan entity
// ─────────────────────────────────────────────

message DataCollectionPlan {
    string                    plan_id      = 1;
    string                    plan_name    = 2;
    DcpState                  state        = 3;
    repeated DataParameter    parameters   = 4;
    google.protobuf.Timestamp created_at   = 5;
    google.protobuf.Timestamp activated_at = 6;
}

// ─────────────────────────────────────────────
// Data report
// ─────────────────────────────────────────────

message DataReport {
    string                    plan_id    = 1;
    string                    report_id  = 2;
    google.protobuf.Timestamp timestamp  = 3;
    map<string, string>       values     = 4;
}

// ─────────────────────────────────────────────
// CRUD requests / responses
// ─────────────────────────────────────────────

message CreatePlanRequest {
    string             plan_name  = 1;
    repeated DataParameter parameters = 2;
}

message CreatePlanResponse {
    cim.common.StatusCode status = 1;
    DataCollectionPlan    plan   = 2;
}

message GetPlanRequest {
    string plan_id = 1;
}

message GetPlanResponse {
    cim.common.StatusCode status = 1;
    DataCollectionPlan    plan   = 2;
}

message ListPlansRequest {}

message ListPlansResponse {
    repeated DataCollectionPlan plans = 1;
}

// ─────────────────────────────────────────────
// Plan lifecycle commands
// ─────────────────────────────────────────────

enum PlanCommand {
    PLAN_COMMAND_UNSPECIFIED = 0;
    PLAN_COMMAND_ACTIVATE    = 1;
    PLAN_COMMAND_PAUSE       = 2;
    PLAN_COMMAND_RESUME      = 3;
    PLAN_COMMAND_DEACTIVATE  = 4;
    PLAN_COMMAND_DELETE      = 5;
}

message PlanCommandRequest {
    string      plan_id = 1;
    PlanCommand command = 2;
}

message PlanCommandResponse {
    cim.common.StatusCode status = 1;
    DataCollectionPlan    plan   = 2;
}

// ─────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────

service DataCollectionService {
    rpc CreatePlan    (CreatePlanRequest)    returns (CreatePlanResponse);
    rpc ExecuteCommand (PlanCommandRequest)  returns (PlanCommandResponse);
    rpc GetPlan       (GetPlanRequest)       returns (GetPlanResponse);
    rpc ListPlans     (ListPlansRequest)     returns (ListPlansResponse);
    rpc StreamReports (cim.common.Empty)     returns (stream DataReport);
}
